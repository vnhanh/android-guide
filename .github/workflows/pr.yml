name: PR Checks

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Typecheck
        run: npm run lint

      - name: Link check
        run: npm run check-links

      - name: Contract check
        run: npm run check-contract

      - name: Concept-link check
        run: npm run check-concepts
